<!doctype html><html class="m"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 466px; }
.phone { position: absolute; top: 22px; width: 172px; border-radius: 28px; padding: 5px; }
.phone .screen { border-radius: 24px; }
.lbl { position: absolute; top: 398px; width: 180px; text-align: center; }
.lbl b { display: block; font-size: 13px; white-space: nowrap; font-weight: 600; color: var(--green-900); line-height: 1.3; }
.lbl span { display: block; font-size: 12px; color: var(--paper-800); margin-top: 3px; line-height: 1.35; }
.num { font-style: normal; display: inline-flex; width: 18px; height: 18px; border-radius: 99px; background: var(--green-900); color: #fff; font-size: 11px; font-weight: 600; align-items: center; justify-content: center; margin-right: 5px; vertical-align: 1px; }
svg.over { position: absolute; left: 0; top: 0; }
</style></head><body><div class="canvas">
  <div class="frame phone" style="left:18px"><div class="screen"><img src="run-classic.png"></div></div>
  <div class="frame phone" style="left:210px"><div class="screen"><img src="run-locked.png"></div></div>
  <div class="lbl" style="left:14px"><b><i class="num">1</i>Tap the speaker</b><span>on the run screen</span></div>
  <div class="lbl" style="left:206px"><b><i class="num">2</i>Locked? Hold the number</b><span>no need to unlock</span></div>
  <svg class="over" width="400" height="500" viewBox="0 0 400 500">
    <circle cx="136" cy="348" r="18" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
    <rect x="240" y="110" width="112" height="46" rx="23" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
  </svg>
</div></body></html>
