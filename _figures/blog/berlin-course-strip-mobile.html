<!doctype html><html class="m"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 916px; padding: 26px 22px; }
h3 { font-size: 18px; font-weight: 600; color: var(--green-900); margin: 6px 0 4px; line-height: 1.25; }
p.sub { font-size: 12.5px; color: var(--paper-800); line-height: 1.35; }
svg { position: absolute; left: 0; top: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style></head><body><div class="canvas">
  <div class="cap">Berlin Marathon · the course</div>
  <h3>Drink stations left, landmarks right</h3>

  <svg width="400" height="916" viewBox="0 0 400 916">

    <text x="170" y="858" font-size="12.5" font-weight="600" fill="#04342C">Finish · past the Gate</text>

    <!-- landmarks hang off the right side of the route -->

      <text x="178" y="397.2">Kottbusser Tor</text>
      <text x="178" y="607.9">Wilder Eber</text>
      <text x="178" y="688.9">Kurfürstendamm</text>
      <text x="178" y="770.0">Potsdamer Platz</text>
      <text x="178" y="818.6">Unter den Linden</text>
    </g>
    <g font-size="11" fill="#888780">
      <text x="178" y="184.2">≈ km 1</text>
      <text x="178" y="297.7">≈ km 8</text>

      <text x="178" y="784.0">≈ km 38</text>
      <text x="178" y="832.6">≈ km 41, then the Gate</text>

    <g stroke="#B4B2A9" stroke-width="1">
      <line x1="150" y1="231.1" x2="128" y2="231.1"/>
      <line x1="150" y1="295.9" x2="128" y2="295.9"/>
      <line x1="150" y1="344.5" x2="128" y2="344.5"/>
      <line x1="150" y1="393.2" x2="128" y2="393.2"/>
      <line x1="150" y1="433.7" x2="128" y2="433.7"/>
