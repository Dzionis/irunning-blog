<!doctype html><html data-format="jpg"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 460px; display: flex; gap: 22px; justify-content: center; align-items: center; }
.story { width: 212px; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; position: relative; background: #222 center / cover no-repeat;
  box-shadow: 0 16px 36px -14px rgba(4,52,44,.35), 0 2px 6px rgba(4,52,44,.08); }
.story img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style></head><body><div class="canvas">
  <div class="story" style="background-image:url(src/bg-bridge-dusk.jpg)"><img src="src/ov-hero.png" style="transform: translateY(-30%)"></div>
  <div class="story" style="background-image:url(src/bg-bluehour.jpg)"><img src="src/ov-hrroute.png" style="transform: translateY(20%)"></div>
  <div class="story" style="background-image:url(src/bg-forest.jpg); background-size: auto 122%; background-position: center top"><img src="src/ov-centre.png" style="transform: translate(31%, 17%) scale(.86)"></div>
</div></body></html>
