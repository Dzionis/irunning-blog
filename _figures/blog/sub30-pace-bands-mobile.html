<!doctype html><html class="m"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 600px; padding: 24px 20px; }
h3 { font-size: 17px; font-weight: 600; color: var(--green-900); margin: 6px 0 4px; line-height: 1.25; }
p.sub { font-size: 12.5px; color: var(--paper-800); line-height: 1.4; }
svg { position: absolute; left: 0; top: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style></head><body><div class="canvas">
  <div class="cap">Sub-30 5K · pace bands per km</div>
  <h3>Every workout sits a few seconds either side of 6:00</h3>
  <p class="sub">Faster is to the left. Easy and long runs use zone 2 heart rate instead.</p>

  <svg width="400" height="600" viewBox="0 0 400 600">
    <!-- x(s) = 30 + (s - 330) * 6.2 ; 5:30 → 30, 6:25 → 371 -->
    <g stroke="#D3D1C7" stroke-width="1">
      <line x1="30" y1="150" x2="30" y2="520"/><line x1="92" y1="150" x2="92" y2="520"/>
      <line x1="154" y1="150" x2="154" y2="520"/><line x1="278" y1="150" x2="278" y2="520"/>
      <line x1="340" y1="150" x2="340" y2="520"/>
    </g>
    <g font-size="11" fill="#888780" text-anchor="middle">
      <text x="30" y="540">5:30</text><text x="92" y="540">5:40</text><text x="154" y="540">5:50</text>
      <text x="278" y="540">6:10</text><text x="340" y="540">6:20</text>
    </g>
    <line x1="216" y1="142" x2="216" y2="526" stroke="#04342C" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="216" y="540" font-size="11.5" font-weight="600" fill="#04342C" text-anchor="middle">6:00</text>
    <text x="200" y="566" font-size="11.5" fill="#444441" text-anchor="middle">29:59 finish = 6:00 /km · 9:39 /mi</text>

    <g font-size="13" fill="#04342C" font-weight="600">
      <text x="20" y="172">Short reps&#160;<tspan font-weight="400" fill="#888780" font-size="11.5">400 m</tspan></text>
      <text x="20" y="232">800 m reps</text>
      <text x="20" y="292">Kilometre reps</text>
      <text x="20" y="352">Time trial&#160;<tspan font-weight="400" fill="#888780" font-size="11.5">5K, week 8</tspan></text>
      <text x="20" y="412">Goal-pace finish</text>
      <text x="20" y="472">Tempo</text>
    </g>
    <g>
      <rect x="61" y="180" width="93" height="22" rx="11" fill="#1D9E75"/>
      <rect x="92" y="240" width="93" height="22" rx="11" fill="#1D9E75"/>
      <rect x="123" y="300" width="80" height="22" rx="11" fill="#1D9E75"/>
      <rect x="154" y="360" width="62" height="22" rx="11" fill="#D85A30"/>
      <rect x="185" y="420" width="81" height="22" rx="11" fill="#BA7517"/>
      <rect x="247" y="480" width="93" height="22" rx="11" fill="#0F6E56"/>
    </g>
    <g font-size="11" fill="#fff" font-weight="600" text-anchor="middle">
      <text x="107" y="195">5:35–5:50</text>
      <text x="138" y="255">5:40–5:55</text>
      <text x="163" y="315">5:45–5:58</text>
      <text x="185" y="375">5:50–6:00</text>
      <text x="225" y="435">5:55–6:08</text>
      <text x="293" y="495">6:05–6:20</text>
    </g>
  </svg>
</div></body></html>
