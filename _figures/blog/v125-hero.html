<!doctype html><html data-format="jpg"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 400px; display: flex; gap: 22px; justify-content: center; align-items: center; }
.frame { width: 148px; border-radius: 24px; padding: 5px; }
.frame .screen { border-radius: 20px; }
.up { transform: translateY(-14px); }
.down { transform: translateY(14px); }
</style></head><body><div class="canvas">
  <div class="frame down"><div class="screen"><img src="src/v125-insights-top.jpg"></div></div>
  <div class="frame up"><div class="screen"><img src="src/v125-pace-top.jpg"></div></div>
  <div class="frame down"><div class="screen"><img src="src/v125-warmup-top.jpg"></div></div>
  <div class="frame up"><div class="screen"><img src="src/v125-celebrate.jpg"></div></div>
</div></body></html>
