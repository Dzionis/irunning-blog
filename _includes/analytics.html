{% if site.ga_measurement_id and site.ga_measurement_id != "G-XXXXXXXXXX" %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_measurement_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga_measurement_id }}');
{%- if site.ga_measurement_id_web and site.ga_measurement_id_web != "" %}
  // Web-only property — same events, no app stream mixed in.
  gtag('config', '{{ site.ga_measurement_id_web }}');
{%- endif %}
</script>
{% endif %}
