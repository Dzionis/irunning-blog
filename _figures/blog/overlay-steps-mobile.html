<!doctype html><html class="m"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 470px; padding: 24px 20px; }
.col { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.step { background: #fff; border: 1px solid var(--paper-400); border-radius: 14px; padding: 11px 14px 11px 50px; position: relative; min-height: 78px; }
.n { position: absolute; left: 14px; top: 13px; width: 24px; height: 24px; border-radius: 99px; background: var(--green-900); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-style: normal; }
.step b { display: block; font-size: 15px; font-weight: 600; color: var(--green-900); line-height: 1.25; }
.step span { display: block; font-size: 12.5px; color: var(--paper-800); line-height: 1.4; margin-top: 2px; }
.step.hl { border-color: var(--green-400); box-shadow: 0 0 0 2px var(--green-50); }
.step.ext { background: transparent; border-style: dashed; }
.tag { position: absolute; right: 12px; top: 12px; font-size: 11px; font-weight: 600; color: var(--green-800); background: var(--green-50); border-radius: 99px; padding: 2px 8px; font-style: normal; }
.step.ext .tag { color: var(--paper-800); background: var(--paper-200); }
</style></head><body><div class="canvas">
  <div class="cap">From finished run to Instagram story</div>
  <div class="col">
    <div class="step"><i class="n">1</i><i class="tag">iRunning</i><b>Open the run</b><span>History › your run › Share</span></div>
    <div class="step"><i class="n">2</i><i class="tag">iRunning</i><b>Pick an overlay</b><span>Transparent filter, Story · 9:16</span></div>
    <div class="step hl"><i class="n">3</i><i class="tag">iRunning</i><b>Copy</b><span>A PNG with a see-through background</span></div>
    <div class="step ext"><i class="n">4</i><i class="tag">Instagram</i><b>Paste on your photo</b><span>Paste it as a sticker, resize, post</span></div>
  </div>
</div></body></html>
