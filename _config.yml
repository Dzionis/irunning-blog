future: true

title: iRunning
description: "Interval running made simple. Build workouts, follow voice cues, track GPS runs, and train with plans — on iPhone and Apple Watch."
url: "https://irunning.app"
baseurl: ""

app_store_url: "https://apps.apple.com/us/app/id6770997508"
ga_measurement_id: "G-LZY2M1LLF5"
# Web-only GA4 property (no iOS/Firebase stream). Fill in once created — the site
# then dual-tags both IDs, so the combined property keeps feeding Google Ads while
# this one stays 100% site traffic. Leave "" to keep single-tagging.
ga_measurement_id_web: ""

# Search Console ownership (Settings -> Ownership verification -> HTML tag).
# Uncomment and paste the content="..." token, then push before hitting Verify.
# webmaster_verifications:
#   google: ""

author:
  name: iRunning Team

social:
  name: iRunning
  # Same profiles as _data/social.yml (jekyll-seo-tag turns these into sameAs)
  links:
    - https://www.instagram.com/irunningapp/
    - https://www.tiktok.com/@irunningapp
    - https://www.youtube.com/@irunningapp
    - https://www.threads.com/@irunningapp
    - https://x.com/irunningapp
    - https://www.facebook.com/irunningapp
    - https://www.pinterest.com/irunningapp/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-feed

permalink: /blog/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "iRunning Team"

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - README.md
  - SITE_CONTEXT.md
  - DESIGN_SYSTEM.md
  - vendor/
