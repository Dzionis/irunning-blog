<!doctype html><html class="m"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas { height: 700px; padding: 24px 20px; }
h3 { font-size: 17px; font-weight: 600; color: var(--green-900); margin: 6px 0 0; line-height: 1.25; }
svg { position: absolute; left: 0; top: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style></head><body><div class="canvas">
  <div class="cap">A zone 2 run in iRunning</div>
  <h3>Your zone, with an alert on both edges</h3>

  <svg width="400" height="700" viewBox="0 0 400 700">
    <text x="20" y="116" font-size="12" font-weight="600" fill="#0F6E56">Zone 2 · 110–128 bpm</text>
    <text x="20" y="132" font-size="11" fill="#444441">default zones · yours follow your max HR</text>

    <rect x="46" y="190" width="334" height="64" fill="#E1F5EE"/>
    <line x1="46" y1="190" x2="380" y2="190" stroke="#1D9E75" stroke-width="1.5"/>
    <line x1="46" y1="254" x2="380" y2="254" stroke="#1D9E75" stroke-width="1.5"/>
    <g font-size="11" fill="#444441" text-anchor="end"><text x="40" y="194">128</text><text x="40" y="258">110</text></g>
    <path d="M46 290 C 64 282, 76 244, 94 234 S 128 224, 146 220 S 180 208, 196 196 S 214 172, 226 170 S 242 184, 258 200 S 292 214, 308 222 S 330 250, 342 264 S 364 256, 380 240"
          fill="none" stroke="#04342C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="210" cy="180" r="5.5" fill="#D85A30"/>
    <line x1="210" y1="175" x2="210" y2="168" stroke="#D85A30" stroke-width="1.5"/>
    <rect x="140" y="142" width="140" height="26" rx="13" fill="#D85A30"/>
    <text x="210" y="160" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">“Heart rate too high”</text>
    <circle cx="336" cy="258" r="5.5" fill="#BA7517"/>
    <line x1="336" y1="264" x2="336" y2="292" stroke="#BA7517" stroke-width="1.5"/>
    <rect x="248" y="292" width="132" height="26" rx="13" fill="#BA7517"/>
    <text x="314" y="310" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">“Heart rate too low”</text>
    <g font-size="11" fill="#888780"><text x="46" y="340">0 min</text><text x="380" y="340" text-anchor="end">40</text></g>

    <line x1="20" y1="366" x2="380" y2="366" stroke="#D3D1C7"/>
    <text x="20" y="396" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#6E7B74">LONG RUN MINUTES · 8 WEEKS</text>

    <!-- baseline 640; 1 min = 2 px; bars 30, step 44, x start 30 -->
    <g fill="#1D9E75">
      <rect x="30" y="540" width="30" height="100" rx="4"/>
      <rect x="74" y="530" width="30" height="110" rx="4"/>
      <rect x="118" y="510" width="30" height="130" rx="4"/>
      <rect x="162" y="550" width="30" height="90" rx="4" fill="#9FE1CB"/>
      <rect x="206" y="500" width="30" height="140" rx="4"/>
      <rect x="250" y="490" width="30" height="150" rx="4"/>
      <rect x="294" y="480" width="30" height="160" rx="4"/>
      <rect x="338" y="540" width="30" height="100" rx="4"/>
    </g>
    <line x1="20" y1="640" x2="380" y2="640" stroke="#888780"/>
    <g font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">
      <text x="45" y="558">50</text><text x="89" y="548">55</text><text x="133" y="528">65</text><text x="177" y="568" fill="#04342C">45</text>
      <text x="221" y="518">70</text><text x="265" y="508">75</text><text x="309" y="498">80</text><text x="353" y="558">50</text>
    </g>
    <g font-size="11" fill="#888780" text-anchor="middle">
      <text x="45" y="658">1</text><text x="89" y="658">2</text><text x="133" y="658">3</text><text x="177" y="658">4</text>
      <text x="221" y="658">5</text><text x="265" y="658">6</text><text x="309" y="658">7</text><text x="353" y="658">8</text>
      <text x="200" y="680">week · week 4 is a cutback</text>
    </g>
    <g font-size="11" font-weight="600">
      <rect x="14" y="414" width="84" height="22" rx="11" fill="#04342C"/>
      <text x="56" y="429" fill="#fff" text-anchor="middle">5K test #1</text>
      <rect x="302" y="414" width="84" height="22" rx="11" fill="#04342C"/>
      <text x="344" y="429" fill="#fff" text-anchor="middle">5K test #2</text>
    </g>
    <path d="M56 436 L 45 532" stroke="#04342C" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M344 436 L 353 532" stroke="#04342C" stroke-width="1" stroke-dasharray="3 3"/>
  </svg>
</div></body></html>
